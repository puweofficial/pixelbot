<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 360px;
      padding: 12px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 13px;
      color: #e0e0ff;
      background: linear-gradient(135deg, rgba(10, 0, 30, 0.97), rgba(20, 0, 40, 0.97));
    }
    h2 {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      text-align: center;
      padding-bottom: 4px;
      margin-bottom: 10px;
      border-bottom: 1px solid rgba(100, 50, 200, 0.4);
      background: linear-gradient(90deg, #4a90e2, #9b59b6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .section {
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .section-title {
      font-weight: bold;
      font-size: 12px;
      margin-bottom: 2px;
      color: #6c5ce7;
    }
    .row {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    label {
      white-space: nowrap;
      min-width: fit-content;
    }
    input[type="text"] {
      flex: 1;
      min-width: 0;
      padding: 3px;
      border: 1px solid rgba(100, 50, 200, 0.6);
      border-radius: 3px;
      background: rgba(10, 0, 30, 0.6);
      color: #e0e0ff;
      font-family: monospace;
      font-size: 12px;
      outline: none;
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    input[type="text"]:focus {
      border-color: #9b59b6;
      box-shadow: 0 0 5px rgba(155, 89, 182, 0.3);
    }
    hr {
      border: none;
      border-top: 1px solid rgba(100, 50, 200, 0.4);
      margin: 4px 0;
    }
    .status {
      font-size: 11px;
      text-align: center;
      margin-top: 6px;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <h2 id="tab-title">PixelBot v3.0.0</h2>

  <div class="section">
    <div class="section-title">Telegram</div>
    <div class="row">
      <label>Bot API:</label>
      <input type="text" id="telegram-bot-api" placeholder="123456:ABC-DEF1234ghIkl-zyx57W2v1u123ew11">
    </div>
    <div class="row">
      <label>Chat ID:</label>
      <input type="text" id="telegram-chat-id" placeholder="-1001234567890">
    </div>
  </div>

  <hr>

  <div class="section">
    <div class="section-title">Discord</div>
    <div class="row">
      <label>Webhook:</label>
      <input type="text" id="discord-webhook" placeholder="https://discord.com/api/webhooks/...">
    </div>
    <div class="row">
      <label>User ID:</label>
      <input type="text" id="discord-user-id" placeholder="123456789012345678">
    </div>
  </div>

  <div class="status" id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
